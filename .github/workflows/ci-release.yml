# Rolling native CI prerelease for dogfooding before a GitHub Release.
# Runs after a successful `build` on main (not PRs). Tag `ci` is rewritten
# each time; `releases/latest` is left pointing at real releases.
# Native binaries only — not nuget.org / Sleet.

name: ci-release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: ci-release
  # Do not cancel an in-flight publish: deleting the rolling `ci` release and
  # then being cancelled leaves an untagged draft that blocks the next create.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  Configuration: Release
  VersionPrefix: 42.42.${{ github.run_number }}
  VersionLabel: ${{ github.event.workflow_run.head_sha || github.sha }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  NDNX_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  native-aot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: native-aot-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🧊 publish
        shell: pwsh
        run: |
          $out = "artifacts/${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish src/ndnx/ndnx.csproj -c $env:Configuration -r ${{ matrix.rid }} --self-contained -p:PublishAot=true -o $out -bl:"publish-${{ matrix.rid }}.binlog"

      - name: 📦 pack
        shell: pwsh
        run: |
          dotnet run --project src/nativepack --no-launch-profile -c $env:Configuration -- artifacts/${{ matrix.rid }} ${{ matrix.rid }} artifacts ci

      - name: 📤 artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/ndnx
            artifacts/${{ matrix.rid }}/ndnx.exe
            artifacts/ndnx-*.zip
            artifacts/ndnx-*.tar.gz
            artifacts/ndnx-*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-${{ matrix.rid }}
          path: '*.binlog'

  publish:
    needs: native-aot
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 📥 native
        uses: actions/download-artifact@v4
        with:
          pattern: native-aot-*
          path: native

      - name: 🚀 ci prerelease
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find native -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \))
          assets+=(install.sh install.ps1)
          if [ "${#assets[@]}" -lt 3 ]; then
            echo "No native archives, checksums, or install scripts found to attach." >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          # Looking up the rolling tag via /releases/tags misses untagged drafts.
          # Those still have tag_name=ci, so create 422s with "already exists".
          # Sweep every matching release by id, including drafts.
          delete_ci_release() {
            local ids id
            ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name == "ci") | .id')"
            while IFS= read -r id; do
              [ -z "${id}" ] && continue
              echo "Deleting existing ci release id=${id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true
            done <<< "${ids}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/ci" || true
          }

          delete_ci_release

          notes="Rolling native build from \`${NDNX_SHA}\`. Not a release.

          Install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/ci/install.sh | NDNX_VERSION=ci sh\`

          Update: \`ndnx --update ci\`"

          attempt=0
          until gh release create ci --prerelease --latest=false --title "CI" \
            --target "${NDNX_SHA}" \
            --notes "${notes}" \
            "${assets[@]}"; do
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge 8 ]; then
              echo "gh release create ci failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "ci tag still present (attempt ${attempt}); retrying..."
            sleep $((attempt * 3))
            delete_ci_release
          done
