# Builds and runs tests in all three supported OSes

name: build
on: 
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        description: Configuration
        options: 
        - Release
        - Debug
  push:
    branches: [ main, 'feature/*', 'rel/*' ]
    paths-ignore:
      - changelog.md
      - readme.md
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_NOLOGO: true
  VersionPrefix: 42.42.${{ github.run_number }}
  VersionLabel: ${{ github.ref }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  Configuration: ${{ github.event.inputs.configuration || 'Release' }}

defaults:
  run:
    shell: bash

jobs:
  os-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lookup.outputs.matrix }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        
      - name: 🔎 lookup
        id: lookup
        shell: pwsh
        run: |
          $path = './.github/workflows/os-matrix.json'
          $os = if (test-path $path) { cat $path } else { '["ubuntu-latest"]' }
          echo "matrix=$os" >> $env:GITHUB_OUTPUT

  build:
    needs: os-matrix
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.os-matrix.outputs.matrix) }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        shell: pwsh
        run: dnx --yes retest -- --no-build

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs
          path: '*.binlog'

  dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ✓ ensure format
        run: |
          dotnet format whitespace --verify-no-changes -v:diag --exclude ~/.nuget
          dotnet format style --verify-no-changes -v:diag --exclude ~/.nuget
